name: Verificar color de WhatsApp
on:
  push:
    branches: [whatsapp-verde-20260918]
    paths: ['.github/workflows/prepare-whatsapp-theme.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whatsapp-verde-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar cambio minimo de WhatsApp
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, os
          root = Path('.')
          page = root / 'index.html'
          data = page.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert actual == '5db80a115b63aacb2e1cd7a773c3a3c58b6cc116', 'La pagina cambio; requiere nueva revision'
          original = data.decode('utf-8')
          Path(os.environ['RUNNER_TEMP'], 'whatsapp-original.html').write_bytes(data)
          css = '''    /* WhatsApp: verde distintivo y texto oscuro de alto contraste. */
              .btn.whatsapp{gap:10px;background:#25d366;color:#073b21;border-color:#075e36;box-shadow:0 10px 24px rgba(37,211,102,.18)}
              .btn.whatsapp:hover{background:#20c65e}
              .btn.whatsapp:focus-visible{outline:3px solid #075e36;outline-offset:4px}
              .whatsapp-icon{display:block;width:24px;height:24px;flex:0 0 24px}
              .card a[href^="https://wa.me/"]{color:#075e36;text-underline-offset:3px}
              .card a[href^="https://wa.me/"]:focus-visible{outline:3px solid #075e36;outline-offset:3px;border-radius:3px}
          '''
          icon = '<svg class="whatsapp-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2a10 10 0 0 0-8.66 15L2 22l5-1.34A10 10 0 1 0 12 2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 7c-.6 0-1.5 1-1.5 2.2 0 2.8 3.6 6.3 6.4 6.3 1.2 0 2.1-.9 2.1-1.5 0-.3-2-1.4-2.3-1.3l-.9 1c-1.4-.5-2.6-1.7-3.1-3.1l1-.9C9.8 9.4 8.5 7 8 7Z" fill="currentColor"/></svg><span>Consultar por WhatsApp</span>'
          assert original.count('class="btn secondary"') == 1
          assert original.count('>Consultar por WhatsApp</a>') == 1
          assert original.count('</style>') == 1
          updated = original.replace('class="btn secondary"', 'class="btn secondary whatsapp"', 1)
          updated = updated.replace('>Consultar por WhatsApp</a>', '>' + icon + '</a>', 1)
          updated = updated.replace('</style>', css + '</style>', 1)
          restored = updated.replace(css, '', 1).replace(icon, 'Consultar por WhatsApp', 1).replace('class="btn secondary whatsapp"', 'class="btn secondary"', 1)
          assert restored == original, 'Cambios fuera del alcance'
          assert re.findall(r'href="([^"]+)"', updated) == re.findall(r'href="([^"]+)"', original)
          assert 'noindex,follow' in updated
          page.write_text(updated, encoding='utf-8')
          print('OK: solo estilos WhatsApp e icono; todos los enlaces y contenidos conservados')
          PY
          git diff --check
      - name: Preparar navegador
        run: |
          python -m pip install --quiet playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Probar verde, contraste, enlaces y tamanos
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json, os, shutil, re
          output = Path(os.environ['RUNNER_TEMP']) / 'whatsapp-checks'
          output.mkdir(exist_ok=True)
          original = Path(os.environ['RUNNER_TEMP'], 'whatsapp-original.html').read_text(encoding='utf-8')
          updated = Path('index.html').read_text(encoding='utf-8')
          def luminance(rgb):
              c = [v/255 for v in rgb]
              c = [v/12.92 if v <= .04045 else ((v+.055)/1.055)**2.4 for v in c]
              return sum(x*y for x,y in zip(c,[.2126,.7152,.0722]))
          def contrast(a,b):
              x,y = sorted((luminance(a),luminance(b)))
              return (y+.05)/(x+.05)
          normal = contrast((7,59,33),(37,211,102))
          hover = contrast((7,59,33),(32,198,94))
          links = contrast((7,94,54),(255,249,242))
          assert min(normal,hover,links) >= 4.5
          results = []
          with sync_playwright() as p:
              binary = shutil.which('google-chrome') or shutil.which('chromium')
              browser = p.chromium.launch(executable_path=binary, headless=True, args=['--no-sandbox']) if binary else p.chromium.launch(headless=True)
              for width, js in [(320,True),(390,True),(768,True),(1366,True),(390,False)]:
                  context = browser.new_context(viewport={'width':width,'height':1100}, java_script_enabled=js, reduced_motion='reduce')
                  context.route('**/*', lambda route: route.fulfill(status=200, content_type='text/html', body='Destino de prueba; no se envia ningun mensaje.'))
                  page = context.new_page()
                  page.set_content(original, wait_until='load')
                  original_hrefs = page.locator('a').evaluate_all('(xs)=>xs.map(x=>x.getAttribute("href"))')
                  fb_before = page.locator('.social-link-button--facebook').evaluate('(e)=>getComputedStyle(e).backgroundColor')
                  tt_before = page.locator('.social-link-button--tiktok').evaluate('(e)=>getComputedStyle(e).backgroundColor')
                  primary_before = page.locator('.primary').evaluate('(e)=>getComputedStyle(e).backgroundImage')
                  page.set_content(updated, wait_until='load')
                  assert original_hrefs == page.locator('a').evaluate_all('(xs)=>xs.map(x=>x.getAttribute("href"))')
                  button = page.locator('.btn.whatsapp')
                  assert button.count() == 1 and button.is_visible()
                  assert button.evaluate('(e)=>getComputedStyle(e).backgroundColor') == 'rgb(37, 211, 102)'
                  assert button.evaluate('(e)=>getComputedStyle(e).color') == 'rgb(7, 59, 33)'
                  assert button.locator('svg').count() == 1
                  box = button.bounding_box()
                  assert box['height'] >= 58 and box['x'] >= 0 and box['x']+box['width'] <= width+1
                  assert page.locator('.social-link-button--facebook').evaluate('(e)=>getComputedStyle(e).backgroundColor') == fb_before
                  assert page.locator('.social-link-button--tiktok').evaluate('(e)=>getComputedStyle(e).backgroundColor') == tt_before
                  assert page.locator('.primary').evaluate('(e)=>getComputedStyle(e).backgroundImage') == primary_before
                  assert page.locator('.card a').count() == 2
                  for link in page.locator('.card a').all():
                      assert link.evaluate('(e)=>getComputedStyle(e).color') == 'rgb(7, 94, 54)'
                  page.locator('.actions').screenshot(path=str(output/f'whatsapp-{width}-js-{js}.png'))
                  if width == 390 and js:
                      page.locator('.content').screenshot(path=str(output/'vista-contactos-movil.png'))
                  if width == 1366:
                      page.locator('.content').screenshot(path=str(output/'vista-contactos-escritorio.png'))
                  expected = button.get_attribute('href')
                  button.focus()
                  page.keyboard.press('Enter')
                  page.wait_for_url(expected)
                  results.append({'width':width,'javascript':js,'green':True,'contacts_green':True,'links_preserved':True,'other_buttons_unchanged':True,'keyboard_navigation':True})
                  context.close()
              browser.close()
          report = {'results':results,'contrast':{'button':normal,'hover':hover,'contact_links':links},'scope':'Solo WhatsApp en boticasdeldrjuan.com. Destinos externos interceptados, sin enviar mensajes.'}
          (output/'report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          (output/'index.html').write_text(updated,encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Guardar evidencias
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-checks
          path: ${{ runner.temp }}/whatsapp-checks
          retention-days: 7
      - name: Guardar solo el cambio visual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/prepare-whatsapp-theme.yml
          git diff --cached --check
          git commit -m 'Aplicar verde distintivo a WhatsApp y conservar los otros botones'
          git push origin HEAD:whatsapp-verde-20260918
